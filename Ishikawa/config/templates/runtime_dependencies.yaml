schema_version: 1

gemma:
  chat_endpoint_url: http://127.0.0.1:8000/v1/chat/completions
  tokenization_endpoint_url: http://127.0.0.1:8000/tokenize
  health_endpoint_url: http://127.0.0.1:8000/health
  credential_environment: ISHIKAWA_GEMMA_API_KEY
  timeout_seconds: 120
  maximum_response_bytes: 4194304

nomic:
  embedding_endpoint_url: http://127.0.0.1:8001/v1/embeddings
  health_endpoint_url: http://127.0.0.1:8001/health
  credential_environment: ISHIKAWA_NOMIC_API_KEY
  timeout_seconds: 120
  maximum_response_bytes: 1048576

postgresql:
  database_name: rag_catalog
  database_user: rag_retrieval
  credential_environment: ISHIKAWA_POSTGRESQL_PASSWORD
  connect_timeout_seconds: 10
